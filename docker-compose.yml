services:
  mariadb:
    image: mariadb:11.4
    container_name: mg-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: marginguard
      MARIADB_USER: marginguard
      MARIADB_PASSWORD: marginguard
    volumes:
      - mg-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mg-mariadb-data:
